name: CI

# Build checks only: no deploy jobs and no secrets. The Postgres service below is a
# throwaway database for the consumer-witness storage tests.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  WITNESS_TEST_DATABASE_URL: postgres://catbird:test_password@localhost:5432/catbird_witness_test

jobs:
  check:
    name: Provenance, fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: catbird
          POSTGRES_DB: catbird_witness_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Clone pinned sibling repos
        # Cargo.toml reaches these through `path = "../..."`. The commits come from
        # scripts/canonical-sibling-provenance.env, the same file the provenance check reads.
        run: |
          set -euo pipefail
          env_file=scripts/canonical-sibling-provenance.env
          value() { awk -F= -v key="$1" '$1 == key { print substr($0, index($0, "=") + 1); exit }' "$env_file"; }
          clone() {
            git clone --filter=blob:none "https://github.com/joshlacal/$1.git" "../$1"
            git -C "../$1" checkout --detach "$2"
          }
          clone Petrel "$(value PETREL_COMMIT)"
          clone PetrelCatbird "$(value PETREL_CATBIRD_COMMIT)"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2

      - name: Verify sibling provenance
        run: ./scripts/check-canonical-sibling-provenance.sh

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked
