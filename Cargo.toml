[workspace]
resolver = "2"
members = [
    "crates/ingest",
    "crates/fanout",
    "crates/consumer-push",
]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Workspace crates
catbird-firehose-ingest = { path = "crates/ingest" }
catbird-firehose-fanout = { path = "crates/fanout" }
catbird-firehose-consumer-push = { path = "crates/consumer-push" }

# AT Protocol (jacquard)
jacquard = { git = "https://github.com/joshlacal/jacquard", rev = "1f5bcf1570c5978aa03d997dd7eef0b9ef25430d", version = "0.13.0", default-features = false, features = ["api_full", "streaming", "dns", "cache"] }
jacquard-common = { git = "https://github.com/joshlacal/jacquard", rev = "1f5bcf1570c5978aa03d997dd7eef0b9ef25430d", version = "0.13.0", features = ["reqwest-client", "websocket"] }
jacquard-api = { git = "https://github.com/joshlacal/jacquard", rev = "1f5bcf1570c5978aa03d997dd7eef0b9ef25430d", version = "0.13.0", features = ["bluesky", "streaming"] }
jacquard-identity = { git = "https://github.com/joshlacal/jacquard", rev = "1f5bcf1570c5978aa03d997dd7eef0b9ef25430d", version = "0.13.0", features = ["dns", "cache"] }

# CAR parsing uses the maintained reader also used by Jacquard.
iroh-car = "0.5.1"
cid = "0.11.3"
ipld-core = { version = "0.4.3", default-features = false, features = ["std"] }
serde_ipld_dagcbor = { version = "0.7.0", default-features = false, features = ["std"] }

# Async runtime
tokio = { version = "1.54.1", features = ["full"] }
futures = "0.3.34"

# Database
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "time", "uuid"] }

# HTTP
axum = "0.8.9"
tower-http = { version = "0.7.1", features = ["cors", "limit"] }
tower = { version = "0.5.3", features = ["limit"] }
reqwest = { version = "0.13.5", features = ["json"] }

# Push notifications
a2 = { git = "https://github.com/joshlacal/a2", rev = "09f296e010cbcd2fc9a385f7c650716847bd47c0", version = "0.10.0" }

# Caching
moka = { version = "0.12.16", features = ["future"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Error handling
anyhow = "1.0.104"
thiserror = "2.0.21"

# Logging / metrics
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
prometheus = "0.14.0"
lazy_static = "1.5.1"

# Crypto / security
sha2 = "0.11.1"
base64 = "0.23.1"
rand = "0.10.3"
constant_time_eq = "0.6.1"
ciborium = "0.2.2"

# Misc
dotenvy = "0.15.7"
chrono = "0.4.45"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
time = { version = "0.3.55", features = ["serde-human-readable"] }
num_cpus = "1.17.0"
circuit_breaker = "0.1.1"
bytes = "1.12.1"
url = "2.5.8"

[package]
name = "catbird-firehose"
version = "0.1.0"
edition.workspace = true

[dependencies]
catbird-firehose-ingest = { workspace = true }
catbird-firehose-fanout = { workspace = true }
catbird-firehose-consumer-push = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
axum = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
num_cpus = { workspace = true }
jacquard-api = { workspace = true }
jacquard-common = { workspace = true }
futures = { workspace = true }
url = { workspace = true }
